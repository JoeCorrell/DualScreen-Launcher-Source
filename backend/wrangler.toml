name = "dualscreen-entitlements"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "dualscreen-entitlements"
database_id = "e0e32567-3cbd-458b-95f3-0b7b2417cb3e"
migrations_dir = "migrations"

[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "84729101"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "84729102"

  [ratelimits.simple]
  limit = 30
  period = 60

[secrets]
required = [
  "PATREON_CLIENT_ID",
  "PATREON_CLIENT_SECRET",
  "TOKEN_ENCRYPTION_KEY",
  "CODE_PEPPER",
  "ADMIN_API_TOKEN",
  "LEASE_SIGNING_PRIVATE_KEY",
]

[vars]
# Public, non-secret deployment configuration. Replace every example value.
PUBLIC_BASE_URL = "https://dualscreen-entitlements.joecorrell03.workers.dev"
APP_CALLBACK_URI = "dualscreen://auth/callback"
PATREON_CAMPAIGN_ID = "15641494"
# Comma-separated Patreon tier IDs. Leave empty to qualify by MIN_PLEDGE_CENTS.
PATREON_TIER_IDS = "29437457,29475609,29461176"
MIN_PLEDGE_CENTS = "100"
LEASE_SECONDS = "3600"
LEASE_SIGNING_KEY_ID = "access-key-1"

# Loki Winlator — Gradle build configuration.

# Two JVMs run a build — Gradle's daemon and the Kotlin compile daemon — and
# bounding only the first is how a machine ends up swapping. The failure does
# not look like memory pressure either: compilation starts reporting
# "unresolved reference" for whole modules whose classes are plainly on the
# classpath. Raise these together if a build genuinely runs out, never one.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m

org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=1

# Off, unlike Loki. The engine's CMake build and the asset-download tasks are
# not configuration-cache clean, and a warning on every build is noise that
# hides real ones.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental=true

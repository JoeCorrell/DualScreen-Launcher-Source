#
# Loki Winlator — dependency version catalog.
#
# Versions are pinned to the same matrix Loki uses, so the design-system modules
# can be brought across as a file copy. The engine's own dependencies are older
# on purpose: they are what Winlator was tested against, and this is not the
# change to combine with a UI rewrite.
#

[versions]
# --- Build tooling -----------------------------------------------------------
agp = "8.9.1"
kotlin = "2.1.20"
javaToolchain = "17"

# --- SDK levels --------------------------------------------------------------
# compileSdk is current; targetSdk is not, and cannot be.
#
# Winlator executes binaries it unpacks into its own data directory. From API 29
# that is refused for any app targeting 29 or above (W^X), and there is no
# permission or flag that restores it — the platform decides from targetSdk
# alone. Raising this number does not produce a warning, it produces an emulator
# that cannot start Wine. minSdk is 26 to match, since the engine's own
# assumptions were written against it.
compileSdk = "36"
targetSdk = "28"
minSdk = "26"

# --- AndroidX ----------------------------------------------------------------
coreKtx = "1.15.0"
appcompat = "1.7.0"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
navigationCompose = "2.8.9"
composeBom = "2025.04.01"
datastore = "1.1.4"
documentfile = "1.0.1"
splashscreen = "1.0.1"
preference = "1.2.1"
recyclerview = "1.3.2"

# --- Third party -------------------------------------------------------------
coil = "2.7.0"
orgJson = "20250107"
kotlinxSerialization = "1.8.1"
kotlinxCoroutines = "1.10.2"

# JavaSteam speaks the Steam client protocol: the same CM login, licence list
# and CDN depot fetch the desktop client uses, so a game installed through it is
# the publisher's own build over Steam's own transport. The depot downloader is
# a separate artifact at the same version and the two must not drift — the
# downloader calls into the core's `SteamContent`/`Client` types directly.
javasteam = "1.8.0"

# Only for rendering the sign-in QR. Steam's device-confirmation flow hands back
# a challenge URL that the phone app scans; nothing here decodes.
zxing = "3.5.3"

# Not optional, and not a modernisation candidate. JavaSteam needs the full
# SHA-1/AES/PKCS7 implementation while Android's process-global "BC" provider
# must remain intact for Conscrypt's BKS keystore. Wemu exposes this dependency
# through JavaSteam's preferred Android provider name, "SC", without replacing
# the platform provider.
bouncyCastle = "1.68"

# --- Engine ------------------------------------------------------------------
# Winlator's own stack. zstd-jni unpacks the container images, commons-compress
# and xz read the tarballs inside them, junixsocket carries the X11 protocol
# over a unix socket, and material 1.x is still needed by the few engine views
# that survived the UI strip.
material = "1.12.0"
zstdJni = "1.5.2-3"
commonsCompress = "1.20"
xz = "1.7"
# Commit behind the signed Release-16.02-2.03 tag. A tag can be moved; a
# dependency that ships native archive-decoding code should not move with it.
sevenZipJBindingAndroid = "875f38aac441f41e6eb693177e020e97971dca97"
junixsocket = "2.6.0"

# --- Testing -----------------------------------------------------------------
junit4 = "4.13.2"
androidxTestExt = "1.2.1"
androidxTestRunner = "1.6.2"
truth = "1.4.4"
turbine = "1.2.0"

[libraries]
# --- Gradle plugins, referenced by build-logic -------------------------------
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

# --- AndroidX ----------------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }

# --- Compose -----------------------------------------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# --- Kotlin ------------------------------------------------------------------
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# The real org.json, for unit tests. Android ships `org.json` as a stub whose
# every method throws, so a JVM test of code that parses JSON silently measures
# the stub rather than the parser unless this shadows it on the test classpath.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# --- Images ------------------------------------------------------------------
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# --- Steam -------------------------------------------------------------------
javasteam = { group = "in.dragonbra", name = "javasteam", version.ref = "javasteam" }
javasteam-depotdownloader = { group = "in.dragonbra", name = "javasteam-depotdownloader", version.ref = "javasteam" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
bouncycastle-prov = { group = "org.bouncycastle", name = "bcprov-jdk15on", version.ref = "bouncyCastle" }

# --- Engine ------------------------------------------------------------------
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
sevenzip-jbinding-android = { group = "com.github.omicronapps", name = "7-Zip-JBinding-4Android", version.ref = "sevenZipJBindingAndroid" }
junixsocket-common = { group = "com.kohlschutter.junixsocket", name = "junixsocket-common", version.ref = "junixsocket" }
junixsocket-native-common = { group = "com.kohlschutter.junixsocket", name = "junixsocket-native-common", version.ref = "junixsocket" }

# --- Testing -----------------------------------------------------------------
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Convention plugins, published by the included `build-logic` build.
wemu-android-application = { id = "wemu.android.application" }
wemu-android-application-compose = { id = "wemu.android.application.compose" }
wemu-android-library = { id = "wemu.android.library" }
wemu-android-library-compose = { id = "wemu.android.library.compose" }

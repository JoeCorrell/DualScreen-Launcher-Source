; Deus Ex: Human Revolution Director's Cut -- dual-screen custom UI
;
; Put this file beside DXHRDC.exe 2.0.66.0, next to this mod's dxgi.dll.
; The normal AYN Thor setup works with these defaults. The log is written to
; DeusExSecondScreen.log in the same directory.

[panel]
; Master switch. With this set to 0, DXGI is forwarded normally and the mod
; installs no panel, renderer, SmartGlass, or input hooks.
enabled = 1

; Enables the independent custom black/gold lower UI. This no longer hooks or
; suppresses the game's upper Scaleform HUD; the custom panel does not need it.
relocate = 1

; Selects the independent whole-interface custom panel implementation.
whole_ui = 1

; Unsafe diagnostic only. The former HUD-hiding implementation intercepted an
; undocumented root Display vtable during save construction and could crash at
; the first live frame. Leave this disabled on Windows and WEMU.
suppress_native_hud_experimental = 0

; Panel location in the guest desktop. Leave these commented on the Thor: the
; first non-primary monitor (THOR-BOTTOM) is selected automatically.
; Use explicit values only for a desktop test or a container that incorrectly
; exposes one tall monitor instead of two separate monitors.
; x = 0
; y = 1080
; width = 1240
; height = 1080

; Desktop testing convenience. Do not enable on the Thor unless diagnosing a
; window-order problem; the lower SurfaceControl does not need topmost status.
; topmost = 1

[ui]
; Show the custom five-page navigation strip: Inventory, Augmentations, Map,
; Objectives, and Data. The side arrow buttons are touch controls and wrap
; between the first and last pages; they do not inject LB/RB input.
tabs = 1

; Keep the lower buffer blank through logos, title menus, save selection, and
; loading. The custom UI appears only after a playable save has initialized.
hide_until_gameplay = 1

[input]
; Experimental diagnostic only. Reserving Back/Select removes that button from
; normal gameplay while a save is active; lower-screen touch does not need it.
reserve_back_experimental = 0

[gameplay]
; Experimental native full-reserve recharge. Keep disabled: the underlying
; game methods are not ABI-safe under every Wine/WEMU build and can crash on
; the first gameplay tick after loading a save.
full_energy_recharge = 0

[hud]
; Experimental custom crosshair rendering into the primary DXVK back buffer.
; Keep disabled on WEMU; this path can terminate the guest during save loading.
custom_crosshair = 0

[display]
; Keep the upper gameplay window as an exact borderless 16:9 client. This also
; corrects Wine configurations that remember 1920x1080 but create a bordered
; 640x480 or 4:3 window inside the Thor's upper panel.
borderless_16_9 = 1
width = 1280
height = 720

[test]
; Desktop testing only. A one-monitor PC has no THOR-BOTTOM surface, and an
; exclusive-fullscreen game can cover the test panel. Enabling this forces the
; game windowed. Pair it with explicit panel.x/y/width/height values above.
;
; windowed = 1
; width = 1280
; height = 720

[advanced]
; Binary-layout diagnostics for DXHRDC.exe 2.0.66.0. These are not tuning
; options and cannot make a different executable revision compatible. Leave
; them commented unless collecting a developer log.
;
; placementslot = 12
; descriptor = 8
; observeslots = 1

[Bridge]
; The diagnostic sampler runs on GameEngine::Update and self-throttles to 10 Hz.
SampleIntervalMs=100
; 0 proves only the update hook; raise one tier at a time after device evidence.
; 1=lifecycle/player, 2=vitals, 3=identity/attributes, 4=vectors,
; 5=area/riftgates, 6=world position.
TelemetryTier=1

[Compatibility]
; Fallback only if WEMU native DirectSound still cannot create the intro stream.
; This exact-build patch drops only a null startup-video audio packet.
StartupAudioGuard=1

[Panel]
Enabled=1
InputPort=17788
; WEMU reserves the center of the bottom 6 percent for system gestures.
ReservedSystemStrip=1

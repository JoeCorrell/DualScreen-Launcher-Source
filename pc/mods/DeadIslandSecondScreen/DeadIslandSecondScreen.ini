; Dead Island: Definitive Edition -- second screen
;
; Goes beside DeadIslandGame.exe, next to dxgi.dll. Every value has a working
; default, so this file is only needed to change something.
;
; The log is DeadIslandSecondScreen.log beside the executable, and the previous
; run is kept as .log.prev. Read it first when diagnosing a device run.

[panel]
; Turn the whole thing off without uninstalling.
enabled = 1

; Whether elements are actually moved. With this off the mod still loads,
; resolves the engine API, walks the UI tree and writes the report, but touches
; nothing -- the setting to use when checking whether a problem is the mod's.
relocate = 1

; Where the bottom screen is, in desktop coordinates.
;
; Left blank, the first non-primary monitor is used, which is what WEMU's RandR
; layout produces: THOR-TOP at the origin and THOR-BOTTOM directly below it.
; Set these by hand only if the container reports one tall desktop instead of
; two monitors.
; x = 0
; y = 1080
; width = 1240
; height = 1080

[game]
; Finding the player.
;
; There is no ILevel::GetLocalPlayer -- the engine does not know what a player
; is, because the player is a gamedll class. The default search asks the level
; for nearby actors, converts each interface pointer to its proven CRTTIObject
; base, and selects the object with player-only fields. The bounded id sweep is
; retained only as a compatibility fallback.
;
; The sweep runs once, spread across frames. It is spread on purpose: walking
; thousands of ids in one Present call, while the level is still loading, is
; what turned a load into a crash in an earlier version of this mod.
;
; find_actors  use the fast, typed nearby-actor search (recommended)
; scan_limit  how high the fallback id sweep goes before giving up
; scan_budget how many fallback ids are examined per frame
;
; If the log says the player was not found, raise scan_limit first -- it also
; prints every distinct class name it saw, which is what to read next.
; scan_limit = 65536
; scan_budget = 512
; find_actors = 1

[ui]
; Custom lower-panel HUD mode. This replaces the native-redirection attempt
; with a simple panel-drawn HUD and hides the original HUD screen.
custom_hud = 1
hide_hud_screen = 1024

; The always-live HUD feed supplies ammo and durability when available.
; Inventory, quick slots, held-item identity and Skills are sampled from the
; verified live PlayerDI/LogicalPlayer models. No hidden vanilla menu is opened.
native_hud_snapshot = 1
native_menu_bridge = 1

; Legacy native-render redirection settings. They are ignored while custom_hud
; is enabled, but remain available for diagnostics with custom_hud = 0.
redirect = 1

; Auto-detect OnRender's vtable slot on the first live UI tree. This is the
; safe path for future game patches, since no hard-coded vtable slot is used.
calibrate = 1

; How many frames to count during calibration before trying candidates. Larger
; values are safer on slow loads; smaller values move to the trial phase sooner.
probe_frames = 20

; How many frames each candidate slot is allowed to prove it draws to the panel.
trial_frames = 1

[test]
; Desktop testing only. Leave these off for the Thor.
;
; A development machine has one monitor and nowhere correct to put the panel,
; and a fullscreen game would cover it. These make a desktop run observable.
;
; topmost = 1
; x = 1290
; y = 40
; width = 620
; height = 540

[mirror]
; Which rectangle of the game's finished frame is lifted onto the panel.
;
; A region blit, not a second render of the world: the scene is drawn once and
; only these pixels are moved. It cannot scale -- CopySubresourceRegion has no
; filter -- so the rectangle is taken at 1:1 and placed on the panel directly.
;
; The defaults take a 1240x720 slice and centre it vertically on the 1240x1080
; panel. This fallback is only used while OnRender is being detected, or if the
; engine build turns out not to expose the expected UI object model.
sourcex = 0
sourcey = 0
width   = 1240
height  = 720
destx   = 0
desty   = 180

[advanced]
; The engine API is resolved by exported name, so there are no addresses to
; correct here. If a symbol is missing the log names it explicitly.

; Walk the live UI tree once and write it to the log. Safe: every value it reads
; is a plain scalar return. Gated on the engine's own IsUIManagerVisible, so it
; cannot run while the game is still loading.
; The UI survey has already answered its question -- the HUD screen is id
; 1024 -- so it is off. Turn it on to re-map the tree after a game patch.
survey = 0
surveybudget = 300

; Kept for compatibility with older INI files. Element-name probing is now
; permanently disabled in code: GetDebugId returns a non-trivial object by
; value and the ABI is not safe to guess.
elementnames = 0

; Find IUIElement::OnRender's vtable slot by counting calls on all 64 slots of a
; live element's vtable.
;
; OFF. It patches every slot of a vtable that all instances of that class share,
; and it does so while a level load is creating and destroying elements. It is
; the tool that identifies the redirect seam, but it is not something to leave
; running.
slotprobe = 0

; Dump a broad reflection field sweep when the player first binds. This is a
; discovery tool and calls string-valued engine fields, so leave it disabled
; for normal play.
dump_player = 0

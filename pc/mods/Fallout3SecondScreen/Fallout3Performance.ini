; Fallout 3 dual-screen performance profile.
; These values are merged into the active Documents\My Games profile.  They
; target main-thread stalls around actors and combat without replacing the
; user's resolution, controls, difficulty, draw distances, or save settings.

[General]
bUseThreadedAI=1
iNumHWThreads=2
bUseThreadedBlood=1
bUseThreadedMorpher=1
bUseThreadedTempEffects=1
bUseThreadedParticleSystem=1

[MAIN]
bCloneModelsInBackground=1

[BackgroundLoad]
bUseBackgroundFileLoader=1
bBackgroundCellLoads=1
bBackgroundPathing=1
bBackgroundNavmeshUpdate=1
bBackgroundLoadLipFiles=1
bLoadBackgroundFaceGen=1
bLoadHelmetsInBackground=1
bCloneModelsInBackground=1
bUseMultiThreadedFaceGen=1
bUseMultiThreadedTrees=1
iBackgroundLoadExtraMaxFPS=60
iBackgroundLoadExtraMinFPS=30

[HAVOK]
iNumHavokThreads=2
bHavokDebug=0

[Audio]
bMultiThreadAudio=0
bUseAudioDebugInformation=0
bEnableAudioCache=1
iAudioCacheSize=2048
iMaxSizeForCachedSound=512

[Display]
bDisplayBoundingVolumes=0
bDrawShadows=0
bDoActorShadows=0
bDoStaticAndArchShadows=0
bDoCanopyShadowPass=0
bActorSelfShadowing=0
bShadowsOnGrass=0
iActorShadowCount=0
iActorShadowCountInt=0
iActorShadowCountExt=0
iMultiSample=0
iPresentInterval=0

[Panel]
RefreshHz=30
; Wine may expose WEMU's 1280x1800 spanning root as one monitor. These are the
; Thor lower-panel coordinates used only when no non-primary Win32 monitor is
; enumerated. WEMU also recognizes the private window identity before moving it.
X=0
Y=720
Width=1240
Height=1080

[Input]
Port=7788

[Bridge]
; Empty uses tightly bounded discovery beneath the current Wine user's known
; configuration roots. Set this to the Windows-visible CONFIG_DIRECTORY path
; only when a container uses a nonstandard location.
Directory=
PollMs=50
; The bridge is change-driven and may legitimately remain quiet while gameplay
; state is unchanged. Keep a long crash/disconnect guard without disabling safe
; actions during normal idle periods.
StaleMs=60000

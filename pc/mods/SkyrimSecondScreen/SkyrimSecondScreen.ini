[panel]
enabled=1
; WEMU normally exposes THOR-BOTTOM as the first non-primary monitor.
; These values are only used when the Wine desktop reports one tall display.
x=0
y=720
width=1240
height=1080

[ui]
touch_port=7788
; Emergency compatibility switch. When enabled, native item models and native
; map capture are disabled while telemetry, pages, touch input, and the UI
; remain available.
safe_mode=0
; Render each installed item's real Skyrim model and textures into a private
; off-screen target. This never paints or captures the gameplay back buffer.
enable_native_item_models=1
; Reconstruct the player from Skyrim records, NIF meshes, DDS materials, and
; a private neutral-pose skeleton. This is isolated from the gameplay camera.
enable_character_preview=1
; Render Skyrim's real world-map scene into a private lower-screen target.
; No flat/software map is substituted when this is disabled.
enable_native_map=0
